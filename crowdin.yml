preserve_hierarchy: 1
# Экспорт только русского языка
export_languages:
  - ru
# Маппинг Crowdin (ru) -> OpenCart (ru-ru)
files:
  # Админ-панель: upload/admin/language/ru-ru/**/*.php
  - source: upload/admin/language/en-gb/**/*.php
    translation: upload/admin/language/%two_letters_code%/**/%file_name%.%file_extension%
    languages_mapping:
      two_letters_code:
        ru: ru-ru

  # Витрина: upload/catalog/language/ru-ru/**/*.php
  - source: upload/catalog/language/en-gb/**/*.php
    translation: upload/catalog/language/%two_letters_code%/**/%file_name%.%file_extension%
    languages_mapping:
      two_letters_code:
        ru: ru-ru

  # Установщик: upload/install/language/ru-ru/**/*.php
  - source: upload/install/language/en-gb/**/*.php
    translation: upload/install/language/%two_letters_code%/**/%file_name%.%file_extension%
    languages_mapping:
      two_letters_code:
        ru: ru-ru

  # Расширения админки: upload/extension/opencart/admin/language/ru-ru/**/*.php
  - source: upload/extension/opencart/admin/language/en-gb/**/*.php
    translation: upload/extension/opencart/admin/language/%two_letters_code%/**/%file_name%.%file_extension%
    languages_mapping:
      two_letters_code:
        ru: ru-ru

  # Расширения витрины: upload/extension/opencart/catalog/language/ru-ru/**/*.php
  - source: upload/extension/opencart/catalog/language/en-gb/**/*.php
    translation: upload/extension/opencart/catalog/language/%two_letters_code%/**/%file_name%.%file_extension%
    languages_mapping:
      two_letters_code:
        ru: ru-ru
