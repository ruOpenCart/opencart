preserve_hierarchy: true

# Маппинг Crowdin (ru) -> OpenCart (ru-ru)
files:
  # === АДМИН-ПАНЕЛЬ ===
  - source: upload/admin/language/en-gb/**/*.php
    translation: upload/admin/language/ru-ru/**/%file_name%.%file_extension%

  # === КАТАЛОГ ===
  - source: upload/catalog/language/en-gb/**/*.php
    translation: upload/catalog/language/ru-ru/**/%file_name%.%file_extension%

  # === УСТАНОВЩИК ===
  - source: upload/install/language/en-gb/**/*.php
    translation: upload/install/language/ru-ru/**/%file_name%.%file_extension%

  # === РАСШИРЕНИЯ (админка) ===
  - source: upload/extension/opencart/admin/language/en-gb/**/*.php
    translation: upload/extension/opencart/admin/language/ru-ru/**/%file_name%.%file_extension%

  # === РАСШИРЕНИЯ (витрина) ===
  - source: upload/extension/opencart/catalog/language/en-gb/**/*.php
    translation: upload/extension/opencart/catalog/language/ru-ru/**/%file_name%.%file_extension%
